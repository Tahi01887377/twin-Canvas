services:
  - type: web
    name: twin-canvas-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npx tsx -r tsconfig-paths/register src/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: CORS_ORIGIN
        value: https://twin-canvas-five.vercel.app
      - key: CLIENT_URL
        value: https://twin-canvas-five.vercel.app